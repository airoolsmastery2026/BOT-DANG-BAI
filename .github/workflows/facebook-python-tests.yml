name: Facebook Python Tests

on:
  push:
    paths:
      - "scripts/facebook/**"
      - ".github/workflows/facebook-python-tests.yml"
  pull_request:
    paths:
      - "scripts/facebook/**"
      - ".github/workflows/facebook-python-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: facebook-python-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    defaults:
      run:
        working-directory: scripts/facebook

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: scripts/facebook/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q auto_post.py tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
