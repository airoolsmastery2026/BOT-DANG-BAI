name: Unpack reviewed components

on:
  push:
    branches:
      - main
    paths:
      - _payload/components.tar.xz.b64
      - .github/workflows/unpack-components.yml

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Decode and verify payload
        shell: bash
        run: |
          base64 --decode _payload/components.tar.xz.b64 > /tmp/components.tar.xz
          echo "cf227738a7466ab82fea8dcbef1572848db7edceabc48816e9334d0fd4ae2b7b  /tmp/components.tar.xz" | sha256sum --check --strict

      - name: Extract reviewed components
        shell: bash
        run: |
          tar -xJf /tmp/components.tar.xz
          test -s src/AdvancedCustomerFinder.jsx
          test -s src/PostScheduler.jsx
          rm -rf _payload
          rm -f .github/workflows/unpack-components.yml

      - name: Commit extracted source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add reviewed customer finder interfaces"
          git push origin HEAD:main
