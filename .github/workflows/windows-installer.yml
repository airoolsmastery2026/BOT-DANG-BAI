name: Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/windows-installer.yml'

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Windows installer
        run: npm run desktop:package

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: BOT-DANG-BAI-Windows-x64
          path: |
            release/windows/*-Setup-*.exe
            release/windows/*-Setup-*.exe.sha256
          if-no-files-found: error
          retention-days: 30
