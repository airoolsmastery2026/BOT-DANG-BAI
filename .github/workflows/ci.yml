name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check active server syntax
        run: |
          node --check server/zalo-server.js
          node --check server/linkedin-server.js
          node --check server/dhp-social-lead-bridge.js
          node --check server/dhp-media-ingress.js
          node --check server/publishing-control-runtime.js
          node --check server/publishing-control-server.js
          node --check server/telegram-control-runtime.js
          node --check server/telegram-control.js
          node --check api/dhp/social-lead.js

      - name: Run bridge and control unit tests
        run: |
          node --test server/dhp-social-lead-bridge.test.js
          node --test server/dhp-media-cloud-sync.test.js
          node --test server/publishing-control-runtime.test.js
          node --test server/telegram-control-runtime.test.js

      - name: Run unit tests
        env:
          CI: true
        run: npm test -- --runInBand

      - name: Build frontend
        env:
          CI: false
        run: npm run build
