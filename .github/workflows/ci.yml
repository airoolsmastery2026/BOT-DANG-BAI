name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Check backend and API syntax
        run: |
          find server scripts api -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          find desktop -type f -name '*.cjs' -print0 | xargs -0 -n1 node --check

      - name: Lint frontend
        run: npm run lint

      - name: Run backend unit and security tests
        run: |
          node --test server/*.test.js
          node --test scripts/*.test.js
          node --test desktop/*.test.cjs

      - name: Run frontend unit tests
        env:
          CI: true
        run: npm test -- --runInBand

      - name: Build production frontend
        env:
          CI: true
        run: npm run build
