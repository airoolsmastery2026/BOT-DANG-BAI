name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check backend syntax
        run: |
          node --check server/zalo-server.js
          node --check server/linkedin-server.js
          node --check server/real-estate-server.js

      - name: Build frontend
        run: npm run build
        env:
          CI: true
